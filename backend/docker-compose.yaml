services:
  postgres:
    image: postgres:16-alpine
    container_name: redoxems_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: redoxems
      POSTGRES_USER: redoxems
      POSTGRES_PASSWORD: redoxems
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
