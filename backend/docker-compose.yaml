services:
  postgres:
    image: postgres:16-alpine
    container_name: redoxems_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: redoxems
      POSTGRES_USER: redoxems
      POSTGRES_PASSWORD: redoxems
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redoxems_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      POSTGRES_DB: redoxems
      POSTGRES_USER: redoxems
      POSTGRES_PASSWORD: redoxems
    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: redoxems_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
